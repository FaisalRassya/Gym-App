<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6E52">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>GiziGym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one phone column. The day is printed as an Indonesian "Informasi Nilai Gizi" panel
   (heavy black rules, % target column, footnote); everything else is quiet ruled lists, not boxed cards.
   Macro colours are bumper-plate colours: red protein, yellow carbs, blue fat, green fibre.
   One family (Archivo): condensed black for numbers & titles, normal width for reading. */
:root{
  --paper:#EDF0F2; --sheet:#FFFFFF; --ink:#000000; --ink-2:#4A535B; --hair:#C9D0D6; --wash:#DFE4E8; --on-ink:#FFFFFF;
  --pro:#D42A2F; --carb:#E3A400; --fat:#1F5FBF; --fib:#1B8A45; --warn:#C2410C;
  --font:"Archivo","Roboto Condensed","Arial Narrow",Roboto,system-ui,sans-serif;
  --dock:0px;
  /* aliases used by inline styles */
  --bg:var(--paper); --fg:var(--ink); --surface:var(--sheet); --sunk:var(--wash); --line:var(--hair); --muted:var(--ink-2);
  --accent:var(--ink); --accent-fg:var(--on-ink); --accent-soft:var(--wash); --water:var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1F23; --sheet:#242A2F; --ink:#F3F5F6; --ink-2:#A1ABB3; --hair:#3A424A; --wash:#2D343A; --on-ink:#1B1F23;
  --pro:#FF5B60; --carb:#FFC737; --fat:#64A2FF; --fib:#43C476; --warn:#FF8B4D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1F23; --sheet:#242A2F; --ink:#F3F5F6; --ink-2:#A1ABB3; --hair:#3A424A; --wash:#2D343A; --on-ink:#1B1F23;
  --pro:#FF5B60; --carb:#FFC737; --fat:#64A2FF; --fib:#43C476; --warn:#FF8B4D; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.45;font-weight:420;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.num,b,.kc{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + var(--dock))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:14px 12px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-stretch:68%;font-size:30px;line-height:1;letter-spacing:-.01em}
.datenav{margin-left:auto;display:flex;align-items:center;gap:6px}
.datenav button{border:1.5px solid var(--ink);background:transparent;width:36px;height:36px;border-radius:6px;font-size:18px;line-height:1}
.datenav span{min-width:96px;text-align:center;font-weight:700;font-stretch:85%;font-size:15px}
h2{font-weight:900;font-stretch:72%;font-size:30px;line-height:1.05;margin:22px 0 6px;text-wrap:balance}
h3{font-weight:750;font-stretch:85%;font-size:18.5px;line-height:1.2;margin:0;text-wrap:balance}
.lbl{font-size:13px;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
/* sections are ruled, not boxed */
.card{background:none;border-top:2px solid var(--ink);padding:12px 0 4px}
.btn{border:0;border-radius:6px;padding:12px 16px;font-weight:700;font-stretch:90%;background:var(--ink);color:var(--on-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.chip{border:1.5px solid var(--hair);background:transparent;border-radius:5px;padding:6px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--sheet);border:1.5px solid var(--hair);border-radius:6px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:13px;color:var(--ink-2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
a{color:var(--ink);text-underline-offset:2px}
.over{color:var(--warn)!important}

/* Informasi Nilai Gizi panel */
.nlabel{background:var(--sheet);border:2.5px solid var(--ink);padding:10px 12px 12px}
.nl-title{font-weight:900;font-stretch:66%;font-size:36px;line-height:.95;margin:0;letter-spacing:-.005em}
.nl-sub{font-size:14px;margin-top:5px;display:flex;justify-content:space-between;gap:10px}
.nl-rule{height:10px;background:var(--ink);margin:8px 0 6px}
.nl-rule.mid{height:4px;margin:8px 0 2px}
.nl-energy{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.nl-energy .k{font-weight:800;font-stretch:80%;font-size:19px}
.nl-energy .v{font-weight:900;font-stretch:66%;font-size:48px;line-height:.9}
.nl-energy .v small{font-size:17px;font-weight:700;font-stretch:85%;margin-left:4px}
.nl-meter{height:12px;border:1.5px solid var(--ink);margin:9px 0 5px;position:relative;overflow:hidden}
.nl-meter i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .4s}
.nl-meter.over i{background:var(--warn)}
.nl-left{font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.nl-left b{font-weight:800}
.nl-head,.nl-row{display:grid;grid-template-columns:1fr 76px 64px;align-items:baseline;text-align:right}
.nl-head{font-size:12.5px;font-weight:700;padding:4px 0 2px}
.nl-row{padding:7px 0;border-top:1px solid var(--ink)}
.nl-row>span:first-child{text-align:left;font-weight:700;display:flex;align-items:center;gap:9px}
.nl-row b{font-weight:800;font-stretch:85%;font-size:16.5px}
.pl{display:inline-block;width:6px;height:17px;border-radius:2px;flex:none;align-self:center}
.nl-water{display:flex;align-items:center;gap:12px;padding-top:8px;border-top:1px solid var(--ink)}
.nl-water .k{font-weight:700;min-width:76px}
.nl-foot{font-size:12px;line-height:1.4;margin:10px 0 0}
.cups{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.cup{width:20px;height:26px;border-radius:2px 2px 6px 6px;border:2px solid var(--ink);background:transparent;padding:0}
.cup.f{background:var(--ink)}

/* ruled lists */
.meal-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.meal-h h3{flex:1}
.meal-h .kc{font-weight:800;font-stretch:85%;font-size:16px}
.tbtn{border:0;background:none;padding:6px 0 6px 10px;font-weight:700;font-stretch:90%;text-decoration:underline;text-underline-offset:3px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0}
.item .nm div:first-child{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .kc{font-weight:800;font-stretch:85%;font-size:15.5px}
.empty-line{color:var(--ink-2);font-size:14px;padding:4px 0 8px}
.x{border:0;background:transparent;color:var(--ink-2);font-size:22px;width:32px;height:32px;border-radius:6px}
.addline{border:1.5px dashed var(--ink-2);background:transparent;border-radius:6px;padding:10px;width:100%;color:var(--ink);font-weight:700;font-stretch:90%;margin-top:6px}
.dots{display:inline-flex;gap:8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.dots i{font-style:normal;color:var(--ink-2)}
.dots i::before{content:"";display:inline-block;width:4px;height:11px;border-radius:1.5px;margin-right:3px;vertical-align:-1px}
.d-p::before{background:var(--pro)}.d-c::before{background:var(--carb)}.d-f::before{background:var(--fat)}.d-s::before{background:var(--fib)}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:0 5px;border-radius:3px;border:1px solid currentColor;color:var(--ink-2);vertical-align:1px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--dock));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:transparent;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:650;font-stretch:88%;color:var(--ink-2)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--ink)}
nav.tabs .plus{color:var(--ink)}
nav.tabs .plus span{width:42px;height:30px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
nav.tabs .plus span svg{width:20px;height:20px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:14px 14px 0 0;max-height:92%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(32px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.nl-meter i{transition:none}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--ink)}
.sheet .sh h3{flex:1;font-weight:900;font-stretch:72%;font-size:24px}
.sheet .sb>.card:first-child,.sheet .sb>.stack>.card:first-child{border-top:0;padding-top:0}
.sheet .sb{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px) + var(--dock)) max(16px,env(safe-area-inset-left,0px))}
.food{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.food .nm{flex:1;min-width:0}
.food .nm div:first-child{font-weight:650}
.food b{font-weight:800;font-stretch:85%}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;font-size:20px;font-weight:700}
.stepper input{text-align:center;width:80px;font-weight:800;font-size:19px}
.macgrid{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;border:2px solid var(--ink);background:var(--sheet)}
.macgrid div{padding:8px 2px;border-left:1px solid var(--ink)}
.macgrid div:first-child{border-left:0}
.macgrid b{display:block;font-size:18px;font-weight:900;font-stretch:72%}
.macgrid span{font-size:11.5px;color:var(--ink-2)}

/* Gym */
.card.prog{border-top:1px solid var(--hair);position:relative;padding:14px 0 14px 32px;text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;background:none}
.card.prog::before{content:"";position:absolute;left:2px;top:17px;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-2)}
.card.prog.on::before{box-shadow:inset 0 0 0 6px var(--ink)}
.exrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--hair);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.exrow:first-child{border-top:0}
.thumb{width:72px;height:48px;border-radius:4px;object-fit:cover;background:#fff;flex:none;border:1px solid var(--hair)}
.exrow .nm{flex:1;min-width:0}
.exrow .nm div:first-child{font-weight:650}
.demo{position:relative;border-radius:6px;overflow:hidden;background:#fff;aspect-ratio:3/2;max-width:100%;border:2px solid var(--ink)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.demo .cap{position:absolute;left:0;bottom:0;background:#000;color:#fff;font-size:13px;font-weight:700;font-stretch:85%;padding:5px 10px}
.demo .ctl{position:absolute;right:0;bottom:0;display:flex}
.demo .ctl button{border:0;background:#000;color:#fff;font-size:13px;padding:5px 12px;font-weight:700}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:6px}
.setrow input{text-align:center;padding:8px 4px;font-weight:700}
.chk{width:44px;height:40px;border-radius:6px;border:2px solid var(--ink-2);background:transparent;font-weight:900;color:transparent}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px) + var(--dock));z-index:55;background:var(--ink);color:var(--on-ink);border-radius:8px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-weight:800;font-stretch:85%;font-size:17px}
.rest button{border:0;border-radius:5px;padding:6px 11px;background:var(--on-ink);color:var(--ink);font-weight:700;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:6px;font-weight:650;font-size:14.5px;max-width:90%}
.empty{text-align:center;padding:22px 10px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block}
.note{border:1.5px dashed var(--ink-2);border-radius:6px;padding:10px 12px;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;border-left:1.5px solid var(--ink);background:transparent;padding:9px 4px;font-weight:700;font-stretch:88%;font-size:14px;color:var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.status-box{display:flex;gap:10px;align-items:center;border:1.5px solid var(--hair);background:var(--sheet);border-radius:6px;padding:10px 12px;font-size:14px}
.status-box.err{display:block;border:2px solid var(--warn);color:var(--ink)}
.spin{flex:none;width:18px;height:18px;border:2.5px solid var(--hair);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
input[type=checkbox]{accent-color:var(--ink)}
details summary{cursor:pointer;padding:4px 0}
#bpick:nth-child(3){grid-column:1/-1}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>

<script src="data.js"></script>
<script src="foods.js"></script>
<script>
"use strict";
/* Hosts that float a badge at the bottom-right (Netlify free plan): reserve a strip under the tab bar */
try{if(/(^|\.)netlify\.app$/.test(location.hostname))document.documentElement.style.setProperty("--dock","68px")}catch(e){}
/* ---------- state ---------- */
const KEY="gizigym_v1";
const DEF={profile:{sex:"m",age:25,w:70,h:170,act:1.55,example:true},diet:"maint",manual:null,water:8,
  log:{},custom:[],gym:{prog:"fb3",next:0},active:null,workouts:[],weights:[]};
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=structuredClone(DEF)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let cur=new Date(); let tab="today";
const EXM=Object.fromEntries(EX.map(e=>[e.id,e]));
const MEALS=[["pagi","Sarapan"],["siang","Makan siang"],["malam","Makan malam"],["snack","Camilan"]];
const DIETS={
  cut:{n:"Cutting (turun lemak)",d:"Defisit ±20% dari TDEE, protein tinggi biar otot nggak ikut hilang. Target turun ±0,5 kg/minggu.",k:0.8,p:2.0,f:0.25},
  recomp:{n:"Rekomposisi",d:"Defisit kecil ±10% + protein sangat tinggi. Cocok kalau baru mulai gym dan mau turun lemak sambil nambah otot.",k:0.9,p:2.2,f:0.25},
  maint:{n:"Maintenance",d:"Kalori sama dengan TDEE. Jaga berat badan sambil latihan.",k:1.0,p:1.6,f:0.28},
  bulk:{n:"Lean bulking",d:"Surplus ±10%, naik ±0,25–0,5 kg/bulan dengan lemak minimal.",k:1.1,p:1.8,f:0.25},
};
const ACTS=[[1.2,"Jarang gerak (kerja duduk)"],[1.375,"Ringan (olahraga 1–3x/mgg)"],[1.55,"Sedang (3–5x/mgg)"],[1.725,"Aktif (6–7x/mgg)"],[1.9,"Sangat aktif (kerja fisik + latihan)"]];

function bmr(p){return 10*p.w+6.25*p.h-5*p.age+(p.sex==="m"?5:-161)}
function targets(){
  const p=S.profile, D=DIETS[S.diet]||DIETS.maint;
  const tdee=bmr(p)*p.act;
  let kcal=Math.round(tdee*D.k/10)*10;
  const floor=p.sex==="m"?1500:1200; let floored=false;
  if(kcal<floor){kcal=floor;floored=true}
  const pr=Math.round(p.w*D.p), fat=Math.round(kcal*D.f/9);
  const carb=Math.max(0,Math.round((kcal-pr*4-fat*9)/4));
  const fib=Math.max(25,Math.round(kcal/1000*14));
  const t={kcal,p:pr,c:carb,f:fat,fib,tdee:Math.round(tdee),bmr:Math.round(bmr(p)),floored};
  if(S.manual) Object.assign(t,S.manual);
  return t;
}
function day(k){return S.log[k]||(S.log[k]={items:[],water:0})}
function totals(k){const d=S.log[k];const t={kcal:0,p:0,c:0,f:0,fib:0};if(d)d.items.forEach(i=>{for(const x in t)t[x]+=i[x]||0});return t}
function toast(m){const el=document.createElement("div");el.className="toast";el.textContent=m;document.body.append(el);setTimeout(()=>el.remove(),1800)}
function niceDate(d){const t=dkey(new Date());const y=new Date();y.setDate(y.getDate()-1);
  if(dkey(d)===t)return"Hari ini";if(dkey(d)===dkey(y))return"Kemarin";
  return d.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"})}

/* ---------- icons ---------- */
const I={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>',
 prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 3v3M16 3v3M8 11h8M8 15h5"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 lib:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>',
 cam:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 prg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>'
};

(async()=>{try{if(!window.claude||!claude.use)return;const s=await claude.use("sample");if(!s)return;

const AIERR={not_granted:"Akses ke Claude tidak diizinkan, jadi fitur foto dimatikan untuk sesi ini.",sampling_disabled:"Claude tidak tersedia untuk akun ini.",
  rate_limited:"Terlalu banyak permintaan atau batas pemakaian tercapai. Coba lagi nanti.",image_rejected:"Fotonya tidak bisa dibaca. Coba foto lain (JPG/PNG).",
  invalid_json:"Hasilnya tidak terbaca. Tap Analisis sekali lagi.",refused:"AI tidak bisa menganalisis foto ini. Coba foto lain.",session_expired:"Sesi habis, login ulang ke Claude dulu.",
  images_unavailable:"Tampilan ini tidak bisa mengirim foto ke Claude.",
  bad_key:"API key Gemini ditolak. Cek lagi key-nya di bagian Progres → AI foto makanan.",gem_quota:"Kuota gratis Gemini habis untuk sementara. Coba lagi beberapa menit lagi atau besok.",
  network:"Nggak ada koneksi internet. Analisis foto butuh internet.",gem_err:"Gemini sedang bermasalah. Coba lagi sebentar.",gem_timeout:"Gemini terlalu lama menjawab. Biasanya karena server Gemini lagi padat. Coba lagi sebentar, atau ganti model ke Flash-Lite di tab Progres.",gem_busy:"Server Gemini lagi penuh (503). Ini masalah di sisi Google, bukan HP kamu. Coba lagi beberapa menit lagi, atau ganti model ke Flash-Lite di tab Progres."};
/* Gemini (own API key) — only outside the Claude viewer, where the page may reach Google's API */
const IN_CLAUDE=!!window.claude;
const GEM="https://generativelanguage.googleapis.com/v1beta/";
function gemReady(){return !IN_CLAUDE&&!!(S.gemini&&S.gemini.key&&S.gemini.model)}
function aiReady(){return AI.ok||gemReady()}
async function gemPickModel(key){
  let r;try{r=await fetch(GEM+"models?pageSize=1000",{headers:{"x-goog-api-key":key}})}catch(e){throw{code:"network"}}
  if(!r.ok){const d=await gemErr(r);throw{code:(r.status===400||r.status===401||r.status===403)?"bad_key":"gem_err",detail:d}}
  const all=((await r.json()).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m=>m.name.replace("models/","")).filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/(image|tts|live|audio|thinking|exp)/.test(n));
  const ver=n=>parseFloat((n.match(/gemini-([\d.]+)/)||[])[1]||0);
  const rank=n=>(/preview/.test(n)?2:0)+(/lite/.test(n)?1:0);
  all.sort((a,b)=>rank(a)-rank(b)||ver(b)-ver(a)||a.length-b.length);
  if(!all.length)throw{code:"gem_err",detail:"Tidak ada model Gemini Flash di akun ini"};
  const flash=all.filter(n=>!/lite|preview/.test(n)),lite=all.filter(n=>/lite/.test(n)&&!/preview/.test(n)),prev=all.filter(n=>/preview/.test(n));
  const pick=[...flash.slice(0,3),...lite.slice(0,2),...prev.slice(0,1)];
  return pick.length?pick:all.slice(0,6);
}
async function gemErr(r){try{const j=await r.json();return "HTTP "+r.status+": "+String(j.error&&j.error.message||j.error&&j.error.status||"").slice(0,160)}catch(e){return "HTTP "+r.status}}
function shrink(file,max=1280){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  ok(c.toDataURL("image/jpeg",0.85).split(",")[1])};im.onerror=()=>no({code:"image_rejected"});im.src=URL.createObjectURL(file)})}
async function analyzePhoto(prompt,file,signal,step=()=>{}){
  if(AI.ok){step("Mengirim foto ke Claude…");return AI.s.json(prompt,{images:[file],signal,modelTier:"default"})}
  const T0=Date.now(),TOTAL=120000,FIRST=75000;
  step("Mengecilkan foto…");
  const b64=await shrink(file,1024);
  step("Foto siap ("+Math.round(b64.length*0.75/1024)+" KB). Menghubungi Gemini…");
  if(!S.gemini.models||!S.gemini.models.length||!S.gemini.models.some(m=>/lite/.test(m))){try{S.gemini.models=await gemPickModel(S.gemini.key);save()}catch(e){if(e.code==="bad_key"||e.code==="network")throw e;S.gemini.models=[]}}
  // Model utama + 1 cadangan dari "kelas" lain: kalau utama Flash, cadangannya Flash-Lite (server terpisah, lebih ringan), dan sebaliknya
  const primary=S.gemini.model,isLite=m=>/lite/.test(m);
  const backup=S.gemini.models.find(m=>m!==primary&&isLite(m)!==isLite(primary))||S.gemini.models.find(m=>m!==primary);
  const cands=[primary,backup].filter(Boolean);
  let last={code:"gem_err",detail:"tidak ada model yang bisa dipakai"};
  for(let mi=0;mi<cands.length;mi++){
    const left=TOTAL-(Date.now()-T0);if(left<15000)break;
    const model=cands[mi];
    let think=/^gemini-([3-9]|\d\d)/.test(model);   // Gemini 3+: pakai thinkingLevel "low" supaya cepat
    for(let attempt=0;attempt<2;attempt++){
      const lim=Math.min(mi===0&&attempt===0?FIRST:TOTAL,TOTAL-(Date.now()-T0));if(lim<10000)break;
      step(mi?"Server "+primary+" lagi penuh, pindah ke "+model+"…":attempt?"Mencoba lagi ("+model+")…":"Gemini ("+model+") sedang menganalisis… biasanya 5–40 detik");
      const gc={responseMimeType:"application/json",temperature:0.2};if(think)gc.thinkingConfig={thinkingLevel:"low"};
      const tctl=new AbortController();const onAbort=()=>tctl.abort();signal.addEventListener("abort",onAbort,{once:true});
      let timedOut=false;const tm=setTimeout(()=>{timedOut=true;tctl.abort()},lim);
      let status=0,txt="";
      try{const r=await fetch(GEM+"models/"+encodeURIComponent(model)+":generateContent",{method:"POST",signal:tctl.signal,
          headers:{"Content-Type":"application/json","x-goog-api-key":S.gemini.key},
          body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],generationConfig:gc})});
        status=r.status;txt=await r.text()}
      catch(e){if(signal.aborted)throw{code:"cancelled"};
        if(timedOut){last={code:"gem_timeout",detail:model+" belum selesai setelah "+Math.round(lim/1000)+" detik"};break}
        throw{code:"network",detail:String(e&&e.message||"")}}
      finally{clearTimeout(tm);signal.removeEventListener("abort",onAbort)}
      let j={};try{j=JSON.parse(txt)}catch(e){}
      if(status===200){
        const t=(((j.candidates||[])[0]||{}).content||{}).parts?.filter(p=>!p.thought).map(p=>p.text||"").join("")||"";
        if(!t){last={code:"refused",detail:(j.promptFeedback&&j.promptFeedback.blockReason)||((j.candidates||[])[0]||{}).finishReason||""};break}
        AI.lastModel=model;
        try{return JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(m)try{return JSON.parse(m[0])}catch(_){}last={code:"invalid_json"};break}
      }
      const d="HTTP "+status+": "+String(j.error&&j.error.message||j.error&&j.error.status||txt.slice(0,120));
      if(status===400&&think&&/thinking/i.test(d)){think=false;attempt--;continue}   // model belum kenal thinkingLevel: ulang tanpa
      if((status===400||status===401||status===403)&&/api.?key|API_KEY|permission|PERMISSION_DENIED|SERVICE_DISABLED/i.test(d))throw{code:"bad_key",detail:d};
      if(status===429){last={code:"gem_quota",detail:d};break}
      if(status>=500){last={code:"gem_busy",detail:d};
        if(mi===cands.length-1&&attempt===0){step("Server Gemini sibuk, coba ulang…");await new Promise(z=>setTimeout(z,2000));continue}
        break}
      last={code:"gem_err",detail:d};break;
    }
  }
  throw last;
}

    go.onclick=async()=>{if(!file)return;go.disabled=true;stop.disabled=false;$("#pres",sh).innerHTML="";
      busy.t0=Date.now();busy("Menyiapkan foto…");st.scrollIntoView({block:"nearest",behavior:"smooth"});ctl=new AbortController();
      const note=$("#pnote",sh).value.trim();
      const prompt=`Kamu ahli gizi yang paham makanan Indonesia. Foto terlampir adalah makanan/minuman yang akan dimakan satu orang.
Tugas: kenali setiap komponen yang terlihat (pisahkan nasi, lauk, sayur, sambal, minuman, dll), perkirakan beratnya dalam gram dari ukuran piring/sendok/tangan di foto, lalu hitung kalori, protein, karbohidrat, lemak, dan serat untuk porsi yang terlihat. Perhitungkan minyak goreng, santan, gula, dan saus yang kelihatan. Pakai nama makanan dalam bahasa Indonesia.
Keterangan dari pengguna: ${note||"(tidak ada)"}
Balas HANYA JSON dengan bentuk persis:
{"items":[{"name":"Nasi putih","portion":"±150 g","grams":150,"kcal":195,"protein":3.6,"carbs":42.6,"fat":0.3,"fiber":0.6}],"confidence":"tinggi|sedang|rendah","note":"satu kalimat dalam bahasa Indonesia tentang asumsi utama"}
Angka gizi per item untuk porsi yang terlihat, dibulatkan 1 desimal. Kalau foto bukan makanan, balas {"items":[],"confidence":"rendah","note":"alasannya"}.`;
      try{
        const r=await analyzePhoto(prompt,file,ctl.signal,m=>busy.set&&busy.set(m));
        const items=(r&&Array.isArray(r.items)?r.items:[]).map(x=>({name:String(x.name||"Makanan").slice(0,60),portion:String(x.portion||(x.grams?x.grams+" g":"1 porsi")).slice(0,40),
          kcal:+x.kcal||0,p:+x.protein||0,c:+x.carbs||0,f:+x.fat||0,fib:+x.fiber||0,m:1,on:true}));
        res={items,conf:String(r&&r.confidence||""),note:String(r&&r.note||"")};done("Selesai dalam "+Math.round((Date.now()-busy.t0)/1000)+" detik"+(AI.lastModel&&!AI.ok?" ("+AI.lastModel+")":"")+".");drawRes();
      }catch(e){if(e&&e.code==="cancelled")done("Dibatalkan.");else done((AIERR[e&&e.code]||"Gagal menganalisis foto.")+(e&&(e.detail||e.message)?" Detail: "+(e.detail||e.message):""),true);
        if(e&&["not_granted","sampling_disabled","images_unavailable"].includes(e.code)){AI.ok=false}}
      finally{clearInterval(tick);go.disabled=!file||!aiReady();stop.disabled=true}};
    function drawRes(){const box=$("#pres",sh);
      if(!res.items.length){box.innerHTML=`<div class="empty">Tidak ada makanan yang terdeteksi. ${esc(res.note)}</div>`;return}
      const sel=res.items.filter(x=>x.on);const tk=sel.reduce((a,x)=>a+x.kcal*x.m,0);
      box.innerHTML=`<div class="card"><div class="meal-h"><h3>Hasil estimasi</h3>${res.conf?`<span class="tag">yakin: ${esc(res.conf)}</span>`:""}</div>
       ${res.items.map((x,i)=>`<div class="item"><input type="checkbox" data-on="${i}" ${x.on?"checked":""} aria-label="Pilih ${esc(x.name)}" style="width:20px;height:20px;flex:none">
         <div class="nm"><input type="text" data-nm="${i}" value="${esc(x.name)}" style="padding:6px 8px;font-weight:600" aria-label="Nama"><div class="small muted" style="margin-top:3px">${esc(x.portion)}
         <span class="dots"><i class="d-p num">${r1(x.p*x.m)}g</i><i class="d-c num">${r1(x.c*x.m)}g</i><i class="d-f num">${r1(x.f*x.m)}g</i><i class="d-s num">${r1(x.fib*x.m)}g</i></span></div></div>
         <div style="text-align:right;flex:none"><b class="num">${r0(x.kcal*x.m)}</b><div><select data-m="${i}" aria-label="Porsi" style="padding:3px 4px;font-size:12.5px;width:auto">${[0.5,0.75,1,1.25,1.5,2].map(v=>`<option value="${v}" ${v===x.m?"selected":""}>${v}×</option>`).join("")}</select></div></div></div>`).join("")}
       ${res.note?`<p class="small muted" style="margin:8px 0 0">${esc(res.note)}</p>`:""}</div>
       <button class="btn block" id="padd" style="margin-top:12px" ${sel.length?"":"disabled"}>Tambahkan ${sel.length} item (${r0(tk)} kkal)</button>
       <p class="small muted">Ini perkiraan dari foto. Cek dan ubah porsi kalau beda dengan yang kamu makan.</p>`;
      box.querySelectorAll("[data-on]").forEach(c=>c.onchange=()=>{res.items[+c.dataset.on].on=c.checked;drawRes()});
      box.querySelectorAll("[data-nm]").forEach(c=>c.oninput=()=>{res.items[+c.dataset.nm].name=c.value});
      box.querySelectorAll("[data-m]").forEach(c=>c.onchange=()=>{res.items[+c.dataset.m].m=+c.value;drawRes()});
      $("#padd",sh).onclick=()=>{const k=dkey(cur);const d=day(k);
        sel.forEach(x=>d.items.push({meal,name:x.name.trim()||"Makanan",q:(x.m!==1?x.m+" × ":"")+x.portion,ai:true,kcal:x.kcal*x.m,p:x.p*x.m,c:x.c*x.m,f:x.f*x.m,fib:x.fib*x.m}));
        save();close();tab="today";render();toast(sel.length+" item dari foto dicatat")};
    }
  });
}

    sh.querySelectorAll("[data-r]").forEach(i=>i.oninput=()=>{g(i.dataset.r).r=i.value;save()});
    sh.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const s=g(b.dataset.c);s.done=!s.done;b.classList.toggle("on",s.done);save();if(s.done)startRest(90)});
    sh.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{const x=A.ex[+b.dataset.addset];const l=x.sets[x.sets.length-1];x.sets.push({w:l?l.w:"",r:l?l.r:"",done:false});save();openSession()});
    sh.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>openEx(b.dataset.ex,true));
    const dis=$("#sdiscard",sh);dis.onclick=()=>{if(dis.dataset.sure){S.active=null;save();close();render();toast("Sesi dibatalkan")}else{dis.dataset.sure=1;dis.textContent="Yakin? Tap lagi"}};
    $("#sfinish",sh).onclick=()=>{let done=0,vol=0;const sets={};
      A.ex.forEach(x=>{sets[x.id]=x.sets.map(s=>({w:+s.w||0,r:+s.r||0,done:s.done}));x.sets.forEach(s=>{if(s.done){done++;vol+=(+s.w||0)*(+s.r||0)}})});
      if(!done){toast("Centang minimal 1 set dulu");return}
      S.workouts.push({date:dkey(new Date()),prog:A.prog,progName:A.progName,dayName:A.dayName,done,vol,min:Math.round((Date.now()-A.started)/60000),sets});
      const prog=PROGRAMS.find(p=>p.id===A.prog);if(prog&&S.gym.prog===A.prog)S.gym.next=(A.di+1)%prog.days.length;
      S.active=null;save();clearInterval(restT);document.querySelector(".rest")?.remove();close();cur=new Date();tab="today";render();toast(`Mantap! ${done} set, volume ${r0(vol)} kg`)};
  });
}

/* ---------- backup ke file ---------- */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const FS=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem, SHR=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;
const BK_DIR="GiziGym", BK_KEEP=7, BK_RE=/^gizigym-\d{4}-\d\d-\d\d\.json$/;
function backupData(){const o=Object.assign({},S,{gemini:null,bk:undefined});o._app="GiziGym";o._at=new Date().toISOString();return JSON.stringify(o)}
function bkWhen(t){const d=new Date(t),hm=d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});return dkey(d)===dkey(new Date())?"hari ini "+hm:d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+" "+hm}
function bkStatus(){
  const b=S.bk;
  if(NATIVE){
    if(!b)return "Backup otomatis jalan tiap hari ke folder <b>Documents/GiziGym</b> di HP (7 hari terakhir disimpan). Belum ada backup.";
    if(b.ok)return `Backup otomatis tiap hari ke <b>Documents/GiziGym</b>. Terakhir: <b>${bkWhen(b.at)}</b>. Untuk jaga-jaga ganti HP, sesekali kirim juga ke WA/Drive.`;
    return `<span class="over">Backup terakhir (${bkWhen(b.at)}) tidak bisa ditulis ke folder Documents${b.where?`, jadi disimpan di ${esc(b.where)}`:""}. File di sana ikut terhapus kalau aplikasi di-uninstall, jadi pakai Kirim ke WA/Drive.</span>${b.err?` <span class="muted">Detail: ${esc(b.err)}</span>`:""}`}
  if(IN_CLAUDE)return "Data cuma tersimpan di browser ini. Salin kode backup dan simpan di tempat lain, atau pulihkan dari file backup aplikasi.";
  return `Data cuma tersimpan di browser ini. Unduh file backup secara berkala.${b?` Terakhir: <b>${bkWhen(b.at)}</b>.`:""}`;
}
async function autoBackup(force){
  if(!NATIVE||!FS())return;
  const today=dkey(new Date());
  if(!force&&S.bk&&S.bk.ok&&S.bk.day===today&&Date.now()-S.bk.at<5*60000)return;
  const name="gizigym-"+today+".json",data=backupData();let dir="DOCUMENTS",err="";
  try{await FS().writeFile({path:BK_DIR+"/"+name,data,directory:"DOCUMENTS",encoding:"utf8",recursive:true})}
  catch(e){err=String(e&&e.message||e);dir="DATA";
    try{await FS().writeFile({path:BK_DIR+"/"+name,data,directory:"DATA",encoding:"utf8",recursive:true})}catch(e2){S.bk={at:Date.now(),day:today,ok:false,where:"",err:err+" / "+String(e2&&e2.message||e2)};save();return}}
  S.bk={at:Date.now(),day:today,ok:dir==="DOCUMENTS",where:dir==="DOCUMENTS"?"Documents/GiziGym":"memori aplikasi",err};save();
  try{const ls=await FS().readdir({path:BK_DIR,directory:dir});
    const names=(ls.files||[]).map(f=>typeof f==="string"?f:f.name).filter(n=>BK_RE.test(n)).sort();
    for(const n of names.slice(0,Math.max(0,names.length-BK_KEEP)))await FS().deleteFile({path:BK_DIR+"/"+n,directory:dir})}catch(e){}
}
async function shareBackup(){
  const name="gizigym-backup-"+dkey(new Date())+".json";
  if(NATIVE&&FS()&&SHR()){
    const w=await FS().writeFile({path:name,data:backupData(),directory:"CACHE",encoding:"utf8"});
    await SHR().share({title:"Backup GiziGym",text:"Backup data GiziGym "+dkey(new Date()),files:[w.uri],dialogTitle:"Simpan atau kirim backup"});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupData()],{type:"application/json"}));a.download=name;document.body.append(a);a.click();a.remove();
}
function askRestore(text,src){
  let o;try{o=JSON.parse(text);if(!o||typeof o!=="object"||!o.profile||!o.log)throw 0}catch(e){toast("Ini bukan file backup GiziGym");return}
  const days=Object.values(o.log).filter(d=>d&&d.items&&d.items.length).length,ses=(o.workouts||[]).length;
  const when=o._at?new Date(o._at).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"tanggal tidak diketahui";
  const box=$("#bconf");box.innerHTML=`<div class="status-box err stack" style="gap:8px"><div>Backup dari <b>${esc(src)}</b> (${esc(when)}): ${days} hari catatan makan, ${ses} sesi latihan.<br>Semua data di HP ini akan <b>diganti</b> dengan isi backup ini.</div>
    <div class="grid2"><button class="btn ghost" id="bno">Batal</button><button class="btn" id="byes">Ganti dengan backup</button></div></div>`;
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
  $("#bno").onclick=()=>{box.innerHTML=""};
  $("#byes").onclick=async()=>{if(NATIVE)await autoBackup(true);   // amankan data sekarang dulu
    const g=S.gemini,bk=S.bk;S=Object.assign(structuredClone(DEF),o,{gemini:g,bk});delete S._app;delete S._at;save();render();toast("Data dipulihkan dari backup")};
}

render();
autoBackup();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")autoBackup(true)});
/* Android app (Capacitor): hardware back closes sheets, then returns to Hari ini, then exits */
try{const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.App){C.Plugins.App.addListener("backButton",()=>{
  const L=$("#layer");if(L.innerHTML){L.innerHTML="";stopDemo();return}
  if(tab!=="today"){tab="today";render();window.scrollTo(0,0);return}
  C.Plugins.App.exitApp()})}}catch(e){}
try{if(!window.Capacitor&&"serviceWorker" in navigator&&location.protocol.startsWith("http")&&!/claude/.test(location.host))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
