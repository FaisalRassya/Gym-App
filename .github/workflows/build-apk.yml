name: Build GiziGym APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cek Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -20
      - name: Buka kunci tanda tangan (terenkripsi di repo, dibuka pakai secret KEYSTORE_PASSWORD)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PW=$(printf "%s" "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t"')
          if [ -z "$PW" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in android/app/gizigym-release.jks.enc -out android/app/gizigym-release.jks -pass "pass:$PW" 2>/dev/null \
             || ! keytool -list -keystore android/app/gizigym-release.jks -storepass "$PW" -alias gizigym >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD salah (panjang ${#PW} karakter, seharusnya 32). Hapus secret-nya lalu tempel ulang persis."
            exit 1
          fi
          echo "Kunci berhasil dibuka."
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR (termasuk dari fork) tidak punya akses ke Secrets: cukup cek kodenya bisa di-build
            ./gradlew assembleDebug --no-daemon --stacktrace
            exit 0
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../GiziGym.apk
      - name: Verifikasi APK (tanda tangan + isi)
        if: github.event_name != 'pull_request'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs GiziGym.apk | head -3
          "$BT/aapt2" dump badging GiziGym.apk | grep -E "package:|application-label:|uses-permission:|sdkVersion|targetSdk"
          unzip -l GiziGym.apk | grep -E "assets/public/(index.html|data.js|foods.js|fonts/fonts.css)"
          echo "Gambar gerakan: $(unzip -l GiziGym.apk | grep -c 'assets/public/img/')"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: GiziGym-APK
          path: GiziGym.apk
      - name: Pasang di halaman Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" GiziGym.apk --repo "${{ github.repository }}" --title "GiziGym 1.0.${{ github.run_number }}" --notes "APK otomatis dari commit ${GITHUB_SHA::7}. Download GiziGym.apk lalu install di Android (izinkan install dari sumber tidak dikenal). Versi baru bisa langsung di-install di atas versi lama." --latest
