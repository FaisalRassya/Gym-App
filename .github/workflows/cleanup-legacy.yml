name: Hapus rilis lama (kunci lama)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-legacy.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Hapus rilis & tag build-3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-3 --repo "${{ github.repository }}" --yes --cleanup-tag || echo "rilis sudah tidak ada"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/build-3" || echo "tag sudah tidak ada"
